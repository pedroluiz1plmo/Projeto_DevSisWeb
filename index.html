<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/dice.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPG Hub - Sistema de Gerenciamento de Fichas</title>
    <!-- Google Fonts: Outfit, Cinzel (RPG style) e JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div id="app" class="app-container">
      <!-- Sidebar Navigation -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="logo-icon">🎲</div>
          <div class="logo-text">
            <h2>RPG HUB</h2>
            <span class="badge badge-unemat">Sua mesa de RPG</span>
          </div>
        </div>

        <nav class="nav-menu">
          <button id="nav-dashboard" class="nav-item active" data-tab="dashboard">
            <span class="nav-icon">📊</span>
            <span class="nav-label">Início</span>
          </button>
          
          <div class="nav-section-title">VISÃO DO JOGADOR</div>
          <button id="nav-sistemas" class="nav-item" data-tab="sistemas">
            <span class="nav-icon">🗂️</span>
            <span class="nav-label">Sistemas</span>
          </button>
          <button id="nav-inventario-sistemas" class="nav-item" data-tab="inventario-sistemas">
            <span class="nav-icon">🎒</span>
            <span class="nav-label">Inventário</span>
          </button>
          <button id="nav-dados" class="nav-item" data-tab="dados">
            <span class="nav-icon">🎯</span>
            <span class="nav-label">Rolagem de Dados</span>
          </button>

          <div class="nav-section-title">VISÃO DO MESTRE (GM)</div>
          <button id="nav-campanhas" class="nav-item" data-tab="campanhas">
            <span class="nav-icon">📜</span>
            <span class="nav-label">Campanhas</span>
          </button>
          <button id="nav-npcs" class="nav-item" data-tab="npcs">
            <span class="nav-icon">🐉</span>
            <span class="nav-label">Monstros</span>
          </button>
          <button id="nav-iniciativa" class="nav-item" data-tab="iniciativa">
            <span class="nav-icon">⚔️</span>
            <span class="nav-label">Iniciativa & Combate</span>
          </button>

        </nav>

        <div class="sidebar-footer">
          <div class="user-profile-badge">
            <div class="avatar">🧙‍♂️</div>
            <div class="user-details">
              <span class="user-name">Pedro & Danny</span>
              <span class="user-role">Prof. Maricy Caregnato</span>
            </div>
          </div>
        </div>
      </aside>

      <!-- Main Content Container -->
      <main class="main-content">
        <!-- Topbar -->
        <header class="topbar">
          <div class="page-title-container">
            <h1 id="page-title">RPG Hub</h1>
            <p id="page-subtitle">Seu espaço para criar personagens e viver aventuras</p>
          </div>
          <div class="topbar-actions">
            <div class="character-quick-select">
              <label for="active-character-select">Personagem Ativo:</label>
              <select id="active-character-select" class="custom-select"></select>
            </div>
             <button id="btn-popup-nota" class="btn btn-secondary" title="Bloco de Notas">
              📝 Nota
            </button>
            <button id="btn-popup-missao" class="btn btn-secondary" title="Quadro de Missões">
              📜 Missão
            </button>
            <button id="btn-quick-roll-d20" class="btn btn-glow" title="Rolar d20 rápido">
              🎲 Rolar d20
            </button>
          </div>
        </header>

        <!-- Dynamic Content Area -->
        <section id="content-area" class="content-body">
          <!-- Views will be injected here dynamically -->
        </section>
      </main>

      <!-- Toast Container for Notifications and Dice Roll Animations -->
      <div id="toast-container" class="toast-container"></div>

      <!-- Quick Dice Roll Modal -->
      <div id="dice-modal" class="modal-backdrop hidden">
        <div class="modal-content glass-card">
          <div class="modal-header">
            <h3>🎯 Rolagem de Dados</h3>
            <button id="btn-close-dice-modal" class="btn-icon">✕</button>
          </div>
          <div class="modal-body" id="dice-modal-body">
            <!-- Dynamic Dice Body -->
          </div>
        </div>
      </div>

      <!-- Modal Pop-up de Nota -->
      <div id="modal-nota" class="modal-backdrop hidden">
        <div class="modal-content glass-card modal-popup-lg">
          <div class="modal-header">
            <div class="modal-title-group">
              <h3>📝 Bloco de Notas</h3>
              <span id="badge-total-notas" class="popup-badge">0 notas</span>
            </div>
            <button id="btn-close-nota-modal" class="btn-icon">✕</button>
          </div>
          <div class="modal-body">
            <!-- Formulário Nova Nota -->
            <form id="form-nova-nota" class="popup-form-box">
              <div class="form-group">
                <label for="input-nota-titulo">Título:</label>
                <input type="text" id="input-nota-titulo" class="form-control" placeholder="Ex: Pista na taverna, Nome do ferreiro..." required />
              </div>
              <div class="form-group">
                <label for="input-nota-conteudo">Anotação:</label>
                <textarea id="input-nota-conteudo" class="form-control" rows="3" placeholder="Escreva segredos, senhas, lembretes de sessão..." required></textarea>
              </div>
              <button type="submit" class="btn btn-primary" style="width: 100%;">
                ➕ Adicionar Nota
              </button>
            </form>

            <div class="popup-section-title">
              <h4>Anotações Salvas</h4>
            </div>
            <div id="lista-notas" class="popup-cards-list">
              <!-- Cards de notas inseridos via TypeScript -->
            </div>
          </div>
        </div>
      </div>

      <!-- Modal Pop-up de Missão -->
      <div id="modal-missao" class="modal-backdrop hidden">
        <div class="modal-content glass-card modal-popup-lg">
          <div class="modal-header">
            <div class="modal-title-group">
              <h3>📜 Quadro de Missões</h3>
              <span id="badge-total-missoes" class="popup-badge">0 ativas</span>
            </div>
            <button id="btn-close-missao-modal" class="btn-icon">✕</button>
          </div>
          <div class="modal-body">
            <!-- Formulário Nova Missão -->
            <form id="form-nova-missao" class="popup-form-box">
              <div class="form-group">
                <label for="input-missao-titulo">Título da Missão:</label>
                <input type="text" id="input-missao-titulo" class="form-control" placeholder="Ex: Resgatar o anão ferreiro..." required />
              </div>
              <div class="form-group">
                <label for="input-missao-descricao">Objetivo / Detalhes:</label>
                <textarea id="input-missao-descricao" class="form-control" rows="2" placeholder="Descreva o local, perigos ou requisitos..." required></textarea>
              </div>
              <div class="form-group">
                <label for="input-missao-recompensa">Recompensa (opcional):</label>
                <input type="text" id="input-missao-recompensa" class="form-control" placeholder="Ex: 100 PO, 300 XP, Amuleto de Proteção" />
              </div>
              <button type="submit" class="btn btn-primary" style="width: 100%;">
                ⚔️ Adicionar Missão
              </button>
            </form>

            <div class="popup-section-title">
              <h4>Missões da Jornada</h4>
            </div>
            <div id="lista-missoes" class="popup-cards-list">
              <!-- Cards de missões inseridos via TypeScript -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
