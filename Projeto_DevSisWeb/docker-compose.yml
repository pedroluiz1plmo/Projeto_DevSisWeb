
services:
  backend:
    build: ./backend
    container_name: devsisweb-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./web
    container_name: devsisweb-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
